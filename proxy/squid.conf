# squid.conf - Konfiguracja serwera Proxy (Strażnika)
# Ten plik definiuje reguły bezpieczeństwa (Egress Filtering) dla naszego środowiska kontenerowego.

# -- 1. Zabezpieczenia podstawowe --
# Definiujemy port nasłuchu (standardowy dla squida to 3128)
http_port 3128

# Jawnie wskazujemy serwery DNS, z których Squid ma korzystać.
# Bez tego Squid w kontenerze Alpine może nie mieć dostępu do resolvera.
dns_nameservers 8.8.8.8 1.1.1.1

# -- 2. Definicja Listy Kontroli Dostępu (ACL) --
# Ładujemy listę dozwolonych domen (whitelist) z pliku zamontowanego jako wolumen.
# 'dstdomain' oznacza dopasowanie po domenie docelowej w żądaniach HTTP/HTTPS.
acl whitelist dstdomain "/etc/squid/whitelist.txt"

# Definiujemy lokalne podsieci z których pozwalamy na połączenia (nasza bezpieczna sieć wewnętrzna Podmana).
# Typowo sieci Podmana korzystają z puli 10.x.x.x, ale zezwolimy ogólnie na cały ruch z sieci prywatnych RFC1918.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# Wbudowane porty uznawane za bezpieczne dla proxy
acl SSL_ports port 443
acl Safe_ports port 80		# http
acl Safe_ports port 443		# https
acl CONNECT method CONNECT

# -- 3. Reguły ruchu HTTP (Główna logika firewall'a) --

# Blokujemy żądania do portów innych niż standardowe HTTP/HTTPS
http_access deny !Safe_ports

# Blokujemy metody CONNECT (dla HTTPS) na porty inne niż SSL
http_access deny CONNECT !SSL_ports

# Ograniczamy kto może pytać nasz proxy - tylko nasza sieć z kontenerów Sandboxa (zmienna localnet)
http_access deny !localnet

# === KRYTYCZNA REGUŁA BIZNESOWA ===
# Zezwalamy na ruch z wewnętrznej sieci TYLKO, jeśli domena znajduje się na liście "whitelist".
http_access allow localnet whitelist

# Odrzucamy wszystkie inne żądania (Bank-Grade Security).
# Jeśli jakikolwiek skrypt spróbuje wejść na domeny spoza listy, odbije się od tej reguły i otrzyma 403 Forbidden.
http_access deny all

# -- 4. Konfiguracja logowania --
# Chcemy widzieć co zostało zablokowane i przepuszczone, by móc diagnozować problemy (tzw. Access Logs)
access_log stdio:/dev/stdout squid

# Minimalizujemy użycie cache na dysku (proxy działa głównie jako firewall w pamięci)
cache_dir null /tmp
